name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: install dependencies
        run: bun install
        working-directory: runtimes/bun
      - name: lint
        run: scripts/ci_lint.sh
      - name: core align
        run: scripts/ci_check_align.sh

  check_bun:
    name: check_bun
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: install dependencies
        run: bun install
        working-directory: runtimes/bun
      - name: check bun version
        run: scripts/ci_check_bun_version.sh
      - name: check dependency updates
        run: scripts/ci_check_updates_bun.sh
      - name: build
        run: scripts/ci_build.sh bun
      - name: type check
        run: scripts/ci_types.sh bun
      - name: security audit
        run: scripts/ci_sec.sh bun
      - name: test
        run: scripts/ci_test.sh bun

  check_node:
    name: check_node
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: install esbuild
        run: npm install --global esbuild
      - name: install dependencies
        run: npm install
        working-directory: runtimes/node
      - name: check node version
        run: scripts/ci_check_node_version.sh
      - name: check dependency updates
        run: scripts/ci_check_updates_node.sh
      - name: build
        run: scripts/ci_build.sh node
      - name: type check
        run: scripts/ci_types.sh node
      - name: security audit
        run: scripts/ci_sec.sh node
      - name: test
        run: scripts/ci_test.sh node

  check_deno:
    if: false # disabled re-enable with task https://github.com/users/ccarcaci/projects/10/views/1?pane=issue&itemId=221489025&issue=ccarcaci%7Crsvr%7C34
    name: check_deno
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: ".deno-version"
      - name: install dependencies
        run: deno install
        working-directory: runtimes/deno
      - name: check deno version
        run: scripts/ci_check_deno_version.sh
      - name: check dependency updates
        run: scripts/ci_check_updates_deno.sh
      - name: build
        run: scripts/ci_build.sh deno
      - name: type check
        run: scripts/ci_types.sh deno
      - name: security audit
        run: scripts/ci_sec.sh deno
      - name: test
        run: scripts/ci_test.sh deno

  executables_smoke_checks:
    needs: [check_bun, check_node] # +check_deno
    name: executables_smoke_checks_(${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: [
          ubuntu-latest,
          ubuntu-24.04-arm,
          macos-latest,
          macos-15-intel ]

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: install dependencies
        run: bun install

      - name: build runner binaries
        run: scripts/runners_build.sh

      - name: smoke test runner binaries
        run: |
          for binary in dist/litevolve_*; do
            [ -f "$binary" ] || continue
            scripts/smoke_test.sh "$(basename "$binary")" "$binary" "$PWD/migrations"
          done

  publish:
    name: publish
    needs: [check_bun, check_node] # don't publish red code
    if: startsWith(github.ref, 'refs/tags/v') # tag push only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - name: install esbuild
        run: npm install --global esbuild

      - name: install bun dependencies
        run: bun install
        working-directory: runtimes/bun

      - name: install node dependencies
        run: npm install
        working-directory: runtimes/node

      - name: build # dist is gitignored — must build before publish
        run: scripts/ci_build.sh bun && scripts/ci_build.sh node

      - name: stage README and LICENSE # not in package roots — copy at CI time, not committed
        run: |
          for dir in runtimes/bun runtimes/node; do
            cp README.md LICENSE.md "$dir/"
          done

      - name: publish litevolve-bun
        run: npm publish
        working-directory: runtimes/bun
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish litevolve-node
        run: npm publish
        working-directory: runtimes/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
